# SCiDA Pro Configuration File
# Solar Cell Data Analysis Application

# Application settings
app:
  name: "SCiDA Pro"
  version: "1.0.0"
  default_style: "Fusion"
  window_width: 1024
  window_height: 576
  font_size: 12

# Color palette for plots
colors:
  palette:
    - "#4F81BD"
    - "#C0504D"
    - "#9BBB59"
    - "#F79646"
    - "#8064A2"
    - "#4BACC6"
    - "black"
    - "gray"
  window_background: [200, 201, 209]
  base_background: [255, 255, 255]
  highlight: [255, 79, 0]

# Data label formats
data_labels:
  formats:
    format_a:
      name: "Data label set A"
      labels: ["Uoc", "Isc", "RserLfDfIEC", "Rsh", "FF", "Eta", "IRev1"]
    format_b:
      name: "Data label set B"
      labels: ["Uoc0", "Isc0", "Rseries_multi_level", "Rshunt_SC", "Fill0", "Eff0", "Ireverse_2"]
      conversion:
        Eta: 100
        FF: 100
    format_c:
      name: "Data label set C"
      labels: ["Uoc", "Isc", "RserIEC891", "RshuntDfDr", "FF", "Eta", "IRev1"]
    format_d:
      name: "Data label set D"
      labels: ["Uoc", "Isc", "Rs", "Rsh", "FF", "NCell", "Irev2"]
      conversion:
        Eta: 100
  default_format: 0
  internal_labels: ["Uoc", "Isc", "RserLfDfIEC", "Rsh", "FF", "Eta", "IRev1"]

# Default filters
filters:
  default:
    - ["IRev1", ">", 3]
    - ["FF", "<", 70]
    - ["Eta", "<", 16]
    - ["FF", "<", 75]
    - ["Rsh", "<", 20]
    - ["Eta", "<", 18]
  max_rows: 12
  valid_operators: ["<", ">"]
  valid_parameters: ["Uoc", "Isc", "RserLfDfIEC", "Rsh", "FF", "Eta", "IRev1"]

# Plot settings
plots:
  default_dot_size: 20
  default_line_width: 3
  default_scatter_amount: 0.5
  font_size: 24
  font_weight: "black"
  tick_pad: 8
  figure_size: [10.0, 10.0]
  dpi: 100
  facecolor: "White"

# Axis labels (LaTeX format)
axis_labels:
  Uoc: "$\\mathrm{\\mathsf{V_{OC}\\ [V]}}$"
  Isc: "$\\mathrm{\\mathsf{I_{SC}\\ [A]}}$"
  Voc_Isc: "$\\mathrm{\\mathsf{V_{OC}\\ *\\ I_{SC}\\ [V*A]}}$"
  FF: "$\\mathrm{\\mathsf{FF\\ [\\%]}}$"
  Eta: "$\\mathrm{\\mathsf{Eta\\ [\\%]}}$"
  RserLfDfIEC: "$\\mathrm{\\mathsf{R_{SERIES}\\ [mOhm \\cdot cm^{2}]}}$"
  Rsh: "$\\mathrm{\\mathsf{R_{SHUNT}\\ [kOhm]}}$"
  IRev1: "$\\mathrm{\\mathsf{I_{REV}\\ [A]}}$"
  normalized_cell: "$\\mathrm{\\mathsf{Normalized\\ cell\\ number\\ [a.u.]}}$"
  density: "$\\mathrm{\\mathsf{Density\\ [a.u.]}}$"
  frequency: "$\\mathrm{\\mathsf{Frequency\\ [\\%]}}$"

# Plot types configuration
plot_types:
  - name: "Boxplot"
    index: 0
  - name: "Violinplot"
    index: 1
  - name: "Category scatter"
    index: 2
  - name: "Walk-through"
    index: 3
  - name: "Rolling mean"
    index: 4
  - name: "Low to high"
    index: 5
  - name: "Histogram"
    index: 6
  - name: "Density"
    index: 7
  - name: "Histogram + density"
    index: 8
  - name: "Voc-Isc"
    index: 9
  - name: "Eta-FF"
    index: 10
  - name: "Rsh-FF"
    index: 11

# Report settings
report:
  summary_index: ["Best cell", "Median", "Average", "Std.dev."]
  summary_columns: ["Voc [V]", "Isc [A]", "Rser [mOhm*cm2]", "Rshunt [kOhm]", "FF [%]", "Eta [%]", "Irev [A]"]
  rounding: [3, 2, 2, 2, 1, 2, 2]

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "scida_pro.log"
